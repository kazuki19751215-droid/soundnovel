<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サウンドノベル">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>html,body{margin:0;height:100%;background:#000}</style>
<title>黒猫 サウンドノベル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;500;700&family=Shippori+Mincho:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,400&display=swap">
<style>
/* 一画面の舞台。影絵の背景が全面、下に語りの帯、右上に小さな操作。夜の世界に固定した単一テーマ。 */
:root {
  --ink: #07070a;        /* 闇 */
  --bone: #e9e2d2;       /* 本文（古い紙の白） */
  --ash: #8d877c;        /* 補助文字 */
  --ember: #b5492f;      /* 血と残り火。使うのは印と区切りだけ */
  --moon: #a9bccf;       /* 月光 */
  --veil: rgba(4,4,6,.86);
  --jp: "Zen Kaku Gothic New", "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", "Meiryo", "IPAPGothic", sans-serif;
  --mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "YuMincho", "BIZ UDPMincho", "Noto Serif JP", "Noto Serif CJK JP", "IPAPMincho", serif;
  --latin: "Cormorant Garamond", "Times New Roman", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
html { background: #000; }
[hidden] { display: none !important; }
body { background: #000; color: var(--bone); font-family: var(--jp); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; --fs: clamp(16px, 2.3vw, 19px); --s: 1; --gx: max(16px, env(safe-area-inset-left, 0px)); --gb: calc(22px + env(safe-area-inset-bottom, 0px)); --gt: calc(10px + env(safe-area-inset-top, 0px)); }
#app.wide { --gx: 7.5%; --gb: 5.5%; --gt: 4.5%; }
#app.wide #title .stack, #app.wide #end .wrap, #app.wide #chapter > div { transform: scale(var(--s)); }
#scene { position: absolute; inset: -3%; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.6s ease; }
.bg.on { opacity: 1; }
#rain, #grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#rain { opacity: 0; transition: opacity 2s; }
#rain.on { opacity: .8; }
#grain { opacity: .09; mix-blend-mode: screen; }
#vignette { transition: opacity 18s ease-in, transform 18s ease-in; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, transparent 35%, rgba(0,0,0,.55) 75%, rgba(0,0,0,.9) 100%); }
#vignette.creep { opacity: 1; transform: scale(.82); }
#vignette::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, transparent 25%, rgba(0,0,0,.85) 70%); opacity: 0; transition: opacity 18s ease-in; }
#vignette.creep::after { opacity: 1; }
#lurk { position: absolute; width: 60px; height: 30px; pointer-events: none; opacity: 0; }
#lurk i { position: absolute; left: 20px; top: 10px; width: 14px; height: 6px; border-radius: 50%; background: #e2d85a; box-shadow: 0 0 10px 2px rgba(226,216,90,.55); }
#lurk.show { animation: lurk 1.6s ease-in-out; }
@keyframes lurk { 0% { opacity: 0; } 25% { opacity: .9; } 55% { opacity: .9; } 62% { opacity: 0; } 100% { opacity: 0; } }
#scare { position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: 0; }
#scare .face { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; display: block; }
#scare .eyeglow { position: absolute; left: 66.8%; top: 42%; width: 22%; aspect-ratio: 1.4; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(255,230,60,.55), rgba(255,200,40,0)); opacity: 0; mix-blend-mode: screen; }
#scare .redflash { position: absolute; inset: 0; background: #8a0a04; mix-blend-mode: multiply; opacity: 0; }
#scare.show { animation: scare .42s linear; }
#scare.show .face { animation: rise .42s cubic-bezier(.45,.05,.55,.95); }
#scare.show .eyeglow { display: none; }
#scare.show .redflash { animation: redf .42s steps(1, end); }
@keyframes scare { 0%, 100% { opacity: 1; } }
@keyframes rise {
  0%   { transform: translateY(110%) scale(1.18); filter: blur(10px) brightness(.6); }
  42%  { transform: translateY(6%) scale(1.06);  filter: blur(2px) brightness(1.15) contrast(1.2); }
  52%  { transform: translateY(-4%) scale(1.04); filter: blur(1.5px) brightness(1.2) contrast(1.25); }
  100% { transform: translateY(-115%) scale(1.12); filter: blur(12px) brightness(.5); }
}
@keyframes redf { 0% { opacity: 0; } 40% { opacity: .6; } 50% { opacity: 0; } 100% { opacity: 0; } }

#text span.glitch { color: #b83a2a; text-shadow: 0 0 6px rgba(184,58,42,.6); }
#flash { position: absolute; inset: 0; pointer-events: none; background: #7a0d06; opacity: 0; mix-blend-mode: multiply; }
#flash.go { animation: flash 2.2s ease-out; }
@keyframes flash { 0% { opacity: 0; } 12% { opacity: .55; } 100% { opacity: 0; } }
/* 揺れは「手持ちカメラが一瞬ぶれる」程度に。振幅は数px、すぐ減衰する */
#scene.shake { animation: shake .9s ease-out; }
@keyframes shake { 0% { transform: translate(0,0); } 8% { transform: translate(-2.5px,1px) rotate(-.12deg); } 18% { transform: translate(2px,-1px) rotate(.1deg); } 30% { transform: translate(-1.2px,.6px); } 45% { transform: translate(.8px,-.3px); } 65% { transform: translate(-.3px,.2px); } 100% { transform: translate(0,0); } }
#scene.blur { animation: sway 6s ease-in-out; }
@keyframes sway { 0%,100% { filter: none; transform: none; } 35% { filter: blur(1.1px) saturate(.8); transform: rotate(-.35deg) scale(1.01); } 70% { filter: blur(.6px); transform: rotate(.25deg) scale(1.005); } }

/* 語りの帯 */
#box { position: absolute; left: 0; right: 0; bottom: 0; padding-left: var(--gx); padding-right: var(--gx); padding-bottom: var(--gb); padding-top: calc(64px * var(--s)); background: linear-gradient(to bottom, transparent, rgba(3,3,5,.82) 42%, rgba(3,3,5,.94)); transition: opacity .6s; }
#box.hide { opacity: 0; }
#boxInner { font-size: var(--fs); max-width: 36em; margin: 0 auto; min-height: 8.6em; position: relative; }
#text { font-family: var(--mincho); font-size: calc(var(--fs) * 1.04); line-height: 2.05; letter-spacing: .05em; font-weight: 500; text-shadow: 0 1px 8px #000; }
#text span, #text rt { opacity: 0; transition: opacity .25s; }
#text rt { transition-duration: .45s; }
#text .on { opacity: 1; }
#text rt { font-size: .5em; letter-spacing: 0; color: var(--ash); }
#orig { font-size: calc(11px * var(--s)); color: var(--ember); letter-spacing: .12em; margin-bottom: 4px; }
#cue { position: absolute; right: 0; bottom: -6px; width: 9px; height: 9px; border-right: 2px solid var(--bone); border-bottom: 2px solid var(--bone); transform: rotate(45deg); opacity: 0; }
#cue.on { animation: cue 1.2s ease-in-out infinite; }
@keyframes cue { 0%,100% { opacity: .2; transform: translateY(-3px) rotate(45deg); } 50% { opacity: .9; transform: translateY(1px) rotate(45deg); } }

/* 操作 */
#ctrl { transition: opacity .7s; position: absolute; top: var(--gt); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
@media (pointer: coarse) { #ctrl { gap: 12px; } #ctrl button { min-height: 44px; min-width: 64px; font-size: calc(13px * var(--s)) !important; } }
#ctrl button { font: 500 calc(12px * var(--s))/1 var(--jp); letter-spacing: .14em; color: var(--ash); background: rgba(0,0,0,.45); border: 1px solid rgba(233,226,210,.18); padding: calc(8px * var(--s)) calc(11px * var(--s)); border-radius: 2px; cursor: pointer; }
#ctrl button[aria-pressed="true"] { color: var(--bone); border-color: rgba(233,226,210,.55); }
#bAuto[aria-pressed="true"] { color: var(--ink); background: var(--bone); border-color: var(--bone); }
button:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
#ctrl.idle { opacity: 0; pointer-events: none; }
#app.idle, #app.idle * { cursor: none; }

/* 章扉 */
#chapter { position: absolute; inset: 0; background: var(--ink); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity 1.1s; z-index: 6; }
#chapter.on { opacity: 1; pointer-events: auto; }
#chapter .num { font: 300 13px/1 var(--jp); letter-spacing: .5em; color: var(--ember); text-align: center; margin-bottom: 18px; }
#chapter .ttl { font: 300 clamp(26px, 6vw, 40px)/1 var(--jp); letter-spacing: .6em; text-align: center; padding-left: .6em; }

/* 選択肢 */
#choice { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 4; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#choice .wrap { display: grid; gap: calc(14px * var(--s)); width: min(calc(22em * var(--s)), 100%); }
#choice .q { text-align: center; font-size: calc(15px * var(--s)); color: var(--ash); letter-spacing: .1em; margin-bottom: 6px; }
#choice button { font: 500 calc(17px * var(--s))/1 var(--jp); letter-spacing: .3em; color: var(--bone); background: rgba(8,8,12,.85); border: 1px solid rgba(233,226,210,.3); padding: calc(18px * var(--s)) 12px; cursor: pointer; transition: border-color .2s, background .2s; }
#choice button:hover, #choice button:focus-visible { border-color: var(--ember); background: rgba(40,12,8,.85); }

/* 扉と終幕 */
.cover { position: absolute; inset: 0; background: var(--ink); z-index: 8; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: opacity 1.4s; }
.cover.fade { opacity: 0; pointer-events: none; }
#title .stack { display: flex; align-items: center; gap: clamp(20px, 6vw, 56px); }
#title .stack { position: relative; }
.titleGallows { position: absolute; left: -12%; top: -8%; width: 46%; color: #e9e2d2; opacity: 0; pointer-events: none; transition: opacity 3s; z-index: -1; }
#title[data-seen="1"] .titleGallows, #title[data-seen="2"] .titleGallows { opacity: .05; }
#title[data-seen="3"] .titleGallows, #title[data-seen="4"] .titleGallows, #title[data-seen="5"] .titleGallows { opacity: .09; }
#title[data-seen="6"] .titleGallows { opacity: .14; color: #b5492f; }
#title[data-seen="3"] .eyes i, #title[data-seen="4"] .eyes i, #title[data-seen="5"] .eyes i { background: #d98a4a; box-shadow: 0 0 12px #a8532a; }
#title[data-seen="6"] .eyes i { background: #b5492f; box-shadow: 0 0 14px #8f1d10; animation-duration: 3.2s; }
#title .kanji { writing-mode: vertical-rl; font: 300 clamp(64px, 17vw, 128px)/1 var(--jp); letter-spacing: .25em; color: var(--bone); }
#title .side { display: grid; gap: 14px; max-width: 15em; }
#title .latin { font: italic 400 clamp(20px, 4vw, 28px)/1.1 var(--latin); color: var(--ash); letter-spacing: .04em; }
#title .cred { font-size: 12px; line-height: 1.9; color: var(--ash); letter-spacing: .08em; }
#title .cred b { font-weight: 500; color: var(--bone); }
.eyes { display: flex; gap: 22px; height: 12px; margin: 4px 0 6px; }
.eyes i { width: 18px; height: 8px; border-radius: 50%; background: #d7cf58; box-shadow: 0 0 12px #b9b02e; animation: blink 6s infinite; }
.eyes i + i { width: 0; height: 0; box-shadow: none; } /* 片目 */
@keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.start { justify-self: start; margin-top: 8px; font: 500 15px/1 var(--jp); letter-spacing: .4em; color: var(--ink); background: var(--bone); border: 0; padding: 15px 22px 15px 26px; cursor: pointer; }
.start:hover { background: #fff; }
.note { font-size: 11px; color: var(--ash); letter-spacing: .1em; }
#end .wrap { max-width: 26em; display: grid; gap: 18px; text-align: center; justify-items: center; }
#end .ttl { font: 300 clamp(22px, 5vw, 30px)/1 var(--jp); letter-spacing: .6em; padding-left: .6em; }
#end p { font-size: calc(14px * var(--s)); line-height: 2; color: var(--ash); }
#end .start { justify-self: center; }
.endBtns, .startBtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.startBtns { justify-content: flex-start; }
.chapList { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5em, 1fr)); gap: 6px; max-width: 24em; }
.chapList button { font: 500 13px/1.3 var(--jp); letter-spacing: .08em; color: var(--bone); background: transparent; border: 1px solid rgba(233,226,210,.25); padding: 8px 10px; text-align: left; cursor: pointer; }
.chapList button:hover, .chapList button:focus-visible { border-color: var(--ember); }
.chapList b { color: var(--ember); font-weight: 500; margin-right: .4em; }
.start.ghost { background: transparent; color: var(--bone); border: 1px solid rgba(233,226,210,.45); }
.start.ghost:hover { background: rgba(233,226,210,.08); }
@media (prefers-reduced-motion: reduce) {
  #scene.shake, #scene.blur, #flash.go, .eyes i, #cue.on, #lurk.show { animation: none !important; }
  #scare.show { animation: scare .42s linear !important; }
  .flick, .rim, .swing, .sway, .smoke, .glow { animation: none !important; }
}
.flick { animation: flick 3.2s infinite alternate ease-in-out; transform-box: fill-box; transform-origin: 50% 100%; }
.flick2 { animation-duration: 2.3s; animation-delay: -.9s; }
@keyframes flick { 0% { opacity: .88; transform: scale(1,.99); } 30% { opacity: 1; } 55% { opacity: .92; transform: scale(.995,1.015); } 80% { opacity: .97; } 100% { opacity: .86; transform: scale(1.005,.995); } }
.rim { animation: rim 3.2s infinite alternate ease-in-out; }
@keyframes rim { 0% { opacity: .75; } 40% { opacity: 1; } 100% { opacity: .7; } }
.swing { animation: swing 7s ease-in-out infinite; transform-origin: 500px 0px; }
@keyframes swing { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
.kcat { opacity: 0; transition: opacity 2s, transform 2.6s ease-in; }
.kcat.on { opacity: 1; }
.kcat .patch { opacity: 0; transition: opacity 2.5s; }
.kcat.patch .patch { opacity: 1; }
.kcat.one .e1 { display: none; }
#catD.flee { transform: translate(-300px, 16px); opacity: 0; }
#ruinsCam { transition: transform 4.5s ease-in-out; transform-origin: 500px 430px; }
#bg-ruins.zoom #ruinsCam { transform: scale(1.7); }
#crowd { transition: opacity 3s; }
#bg-ruins.zoom #crowd { opacity: 0; }
#wallcat { transition: opacity 4s; opacity: .22 !important; }
#bg-ruins.zoom #wallcat { opacity: 1 !important; }
#bg-ruins[data-s~="empty"] #wallcat { opacity: 0 !important; }
#bg-patch #pGallows { opacity: 0; transition: opacity 6s ease-in; }
#bg-patch #pBlob { transition: opacity 6s ease-in, transform 7s ease-in-out; transform-origin: 500px 600px; }
#bg-patch[data-s~="gallows"] #pGallows { opacity: 1; }
#bg-patch[data-s~="gallows"] #pBlob { opacity: 0; transform: scale(.92); }
#bg-bed #bedCat { transition: opacity 1.8s; }
#bg-bed[data-s~="empty"] #bedCat { opacity: 0; }
#bg-cellar .layer { opacity: 0; transition: opacity 1.4s; }
#bg-cellar[data-s~="axe"] #cAxe, #bg-cellar[data-s~="hole"] #cHole, #bg-cellar[data-s~="fresh"] #cFresh,
#bg-cellar[data-s~="police"] #cPolice, #bg-cellar[data-s~="reveal"] #cReveal { opacity: 1; }
#bg-cellar[data-s~="reveal"] #cLamp, #bg-cellar[data-s~="police"] #cLamp { opacity: 0; }
#cTopcat { opacity: 0; transition: opacity 1.2s; }
#fireWatchers, #ruinsCat, #cPolice > path:first-child { transition: opacity 1.2s; }
#bg-fire[data-s~="nowatch"] #fireWatchers { opacity: 0; }
#ruinsCat { opacity: 0; }
#bg-ruins[data-s~="cat"] #ruinsCat { opacity: 1; }
#bg-ruins[data-s~="empty"] #crowd { opacity: 0; }
#bg-cellar[data-s~="reveal"] #cPolice > path:first-child { opacity: 0; }
#bg-cellar[data-s~="cat"] #cTopcat { opacity: 1; }
#bg-cellar[data-s~="axe"] #cLight { animation-duration: 1.3s; }
.glow { animation: glow 3s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .7; } to { opacity: 1; } }
.sway { animation: sway2 6s ease-in-out infinite; transform-origin: 526px 456px; }
@keyframes sway2 { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
.smoke { animation: drift 16s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(0,0); } to { transform: translate(-40px,-24px); } }
#nightEyes { transition: transform 1.6s ease-in, opacity 1.6s ease-in; }
#nightEyes.flee { transform: translate(150px, 10px); opacity: 0; }
.ceyes ellipse { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
#toast { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); max-width: min(30em, 86%); padding: 12px 16px; background: rgba(0,0,0,.82); color: var(--bone); border: 1px solid rgba(233,226,210,.3); font: 400 14px/1.7 var(--jp); letter-spacing: .06em; z-index: 9; opacity: 0; pointer-events: none; transition: opacity .5s; }
#toast.on { opacity: 1; }
</style>

<div id="app" lang="ja">
  <div id="scene">
    <!-- 独房 -->
    <svg class="bg" id="bg-cell" viewBox="-389 0 1778 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="g-cell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2433"/><stop offset="1" stop-color="#06080c"/></linearGradient>
        <linearGradient id="g-beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8cde3" stop-opacity=".35"/><stop offset="1" stop-color="#b8cde3" stop-opacity="0"/></linearGradient>
        <radialGradient id="g-candle"><stop offset="0" stop-color="#ffb555" stop-opacity=".55"/><stop offset=".5" stop-color="#d06a22" stop-opacity=".15"/><stop offset="1" stop-color="#d06a22" stop-opacity="0"/></radialGradient>
        <pattern id="p-brick" width="120" height="60" patternUnits="userSpaceOnUse"><rect width="120" height="60" fill="none"/><path d="M0 0H120M0 30H120M30 0V30M90 30V60" stroke="#05070a" stroke-width="3" opacity=".55" fill="none"/></pattern>
      </defs>
      <rect x="-400" width="1800" height="1000" fill="url(#g-cell)"/>
      <rect x="-400" width="1800" height="1000" fill="url(#p-brick)"/>
      <rect x="415" y="150" width="170" height="185" fill="#0b1018"/>
      <rect x="425" y="160" width="150" height="165" fill="#41536a"/>
      <circle cx="538" cy="205" r="26" fill="#d9e3ec" opacity=".85"/>
      <g fill="#06080c"><rect x="450" y="160" width="9" height="165"/><rect x="482" y="160" width="9" height="165"/><rect x="514" y="160" width="9" height="165"/><rect x="546" y="160" width="9" height="165"/><rect x="425" y="236" width="150" height="7"/></g>
      <polygon points="425,325 575,325 790,1000 250,1000" fill="url(#g-beam)"/>
      <circle cx="659" cy="530" r="240" fill="url(#g-candle)" class="flick"/>
      <!-- 椅子 -->

const S = [
  { chapter: ['序', '告白'], bg: 'cell', amb: 'cell',
    t: '私がこれから書こうとしているきわめて奇怪な、またきわめて{素朴|そぼく}な物語については、自分はそれを信じてもらえるとも思わないし、そう願いもしない。' },
  { t: '自分の感覚でさえが自分の経験したことを信じないような場合に、他人に信じてもらおうなどと期待するのは、ほんとに正気の{沙汰|さた}とは言えないと思う。' },
  { t: 'だが、私は正気を失っている訳ではなく、――また決して夢みているのでもない。' },
  { t: 'しかしあす私は死ぬべき身だ。', sfx: 'bell' },
  { t: 'で、今日のうちに自分の魂の重荷をおろしておきたいのだ。' },
  { t: 'それらの出来事は、その結果として、私を恐れさせ――苦しめ――そして破滅させた。', sfx: 'thud', fx: 'shake' },

  { chapter: ['一', 'プルートォ'], bg: 'home', amb: 'home',
    t: '子供のころから私はおとなしくて情けぶかい性質で知られていた。' },
  { t: 'とりわけ動物が好きで、両親もさまざまな生きものを私の思いどおりに飼ってくれた。' },
  { t: '私は若いころ結婚したが、幸いなことに妻は私と性の合う気質だった。' },
  { t: '私たちは鳥類や、金魚や、一匹の立派な犬や、{兎|うさぎ}や、一匹の{小猿|こざる}や、一匹の猫などを飼った。' },
  { t: 'この最後のものは非常に大きな美しい動物で、体じゅう黒く、驚くほどに利口だった。', cat: ['cat', 'on'], sfx: 'meow' },
  { t: '心ではかなり迷信にかぶれていた妻は、黒猫というものがみんな魔女が姿を変えたものだという、あの昔からの世間の言いつたえを、よく口にしたものだった。' },
  { t: 'プルートォ――というのがその猫の名であった――は私の気に入りであり、遊び仲間であった。' },
  { alt2: '食物をやるのはいつも私だけだったし、彼は家じゅう私の行くところへどこへでも一緒に来た。――今も、来ている。', t: '食物をやるのはいつも私だけだったし、彼は家じゅう私の行くところへどこへでも一緒に来た。' },
  { choice: 'プルートォが足もとにすり寄ってきた。', options: [

      { label: '頭を撫でる', steps: [{ t: '黒い毛並みは絹のようになめらかで、彼は目を細めて咽喉を鳴らした。', sfx: 'purr', orig: true }] }

  { chapter: ['二', '悪鬼'], bg: 'tavern', amb: 'tavern',
    t: '私と猫との親しみはこんなぐあいにして数年間つづいたが、', sfx: 'clink' },

  { bg: 'night', amb: 'night', sfx: 'steps',
    t: 'ある夜、町のそちこちにある自分の行きつけの酒場の一つからひどく酔っぱらって帰って来ると、' },

  { t: '私は彼をひっとらえた。', sfx: 'hiss', heart: 72 },
  { t: 'そのとき彼は私の手荒さにびっくりして、歯で私の手にちょっとした傷をつけた。', heart: 96 },

  { bg: 'black', amb: 'none', heart: 0, sfx: 'screech', t: '', wait: 3200 },
  { t: 'この憎むべき凶行をしるしながら、私は{面|おもて}をあからめ、体がほてり、身ぶるいする。' },

  { chapter: ['三', '天邪鬼'], bg: 'dawn', amb: 'dawn',
    t: '朝になって理性が戻ってきたとき――一晩眠って前夜の乱行の毒気が消えてしまったとき――自分の犯した罪にたいしてなかば恐怖の、なかば悔恨の情を感じた。' },
  { t: 'が、それもせいぜい弱い{曖昧|あいまい}な感情で、心まで動かされはしなかった。私はふたたび無節制になって、間もなくその行為のすべての記憶を酒にまぎらしてしまった。' },
  { t: 'そのうちに猫はいくらかずつ回復してきた。眼のなくなった{眼窩|がんか}はいかにも恐ろしい様子をしてはいたが、もう痛みは少しもないようだった。', cat: ['catD', 'on one'] },
  { t: '彼はもとどおりに家のなかを歩きまわっていたけれども、当りまえのことであろうが私が近づくとひどく恐ろしがって逃げて行くのだった。', cat: ['catD', 'on one flee'], sfx: 'scurry' },
  { t: '私は、前にあんなに自分を慕っていた動物がこんなに明らかに自分を嫌うようになったことを、初めは悲しく思うくらいに、昔の心が残っていた。しかしこの感情もやがて{癇癪|かんしゃく}に変っていった。' },
  { bg: 'cell', amb: 'cell',
    t: 'それから、まるで私を最後の取りかえしのつかない破滅に陥らせるためのように、{天邪鬼|あまのじゃく}の心持がやってきた。' },
  { t: 'してはいけないという、ただそれだけの理由で、自分が邪悪な、あるいは愚かな行為をしていることに、人はどんなにかしばしば気づいたことであろう。' },
  { t: '人は、{掟|おきて}を、単にそれが掟であると知っているだけのために、その最善の判断に逆らってまでも、その掟を破ろうとする永続的な性向を、持っていはしないだろうか？' },
  { t: 'この天邪鬼の心持がいま言ったように、私の最後の破滅を来たしたのであった。', sfx: 'thud' },
  { bg: 'garden', amb: 'garden',
    t: 'ある朝、冷然と、私は猫の首に{輪索|わな}をはめて、一本の木の枝につるした。', sfx: 'creak' },
  { t: '――眼から涙を流しながら、心に痛切な悔恨を感じながら、つるした。' },
  { t: '――その猫が私を慕っていたということを知っていればこそ、猫が私を怒らせるようなことはなに一つしなかったということを感じていればこそ、つるしたのだ。', sfx: 'creak' },
  { t: '――そうすれば自分は罪を犯すのだ、――自分の不滅の魂をいとも慈悲ぶかく、いとも{畏|おそ}るべき神の無限の慈悲の及ばない{彼方|かなた}へ置く――もしそういうことがありうるなら――ほどにも危うくするような極悪罪を犯すのだ、ということを知っていればこそ、つるしたのだった。' },

  { chapter: ['四', '火'], bg: 'fire', amb: 'fire',
    t: 'この残酷な行為をやった日の晩、私は火事だという叫び声で眠りから覚まされた。', sfx: 'alarm' },
  { t: '私の寝台のカーテンに火がついていた。家全体が燃え上がっていた。' },
  { t: '妻と、召使と、私自身とは、やっとのことでその火災からのがれた。' },
  { t: 'なにもかも焼けてしまった。私の全財産はなくなり、それ以来私は絶望に身をまかせてしまった。', sfx: 'collapse', fx: 'shake' },
  { bg: 'ruins', amb: 'ruins',
    t: 'この災難とあの凶行とのあいだに因果関係をつけようとするほど、私は心の弱い者ではない。' },
  { t: '火事のつぎの日、私は焼跡へ行ってみた。壁は、一カ所だけをのぞいて、みんな焼け落ちていた。' },
  { t: 'この壁のまわりに真っ黒に人がたかっていて、多くの人々がその一部分を綿密な熱心な注意をもって調べているようだった。' },
  { t: '「妙だな！」「不思議だね？」という言葉や、その他それに似たような文句が、私の好奇心をそそった。', sfx: 'murmur' },
  { t: '近づいてみると、その白い表面に{薄肉彫|うすにくぼ}りに彫ったかのように、巨大な猫の姿が見えた。', zoom: true, sfx: 'stinger' },
  { t: 'その{痕|あと}はまったく驚くほど正確にあらわれていた。その動物の首のまわりには{縄|なわ}があった。' },
  { t: '最初この{妖怪|ようかい}――というのは私にはそれ以外のものとは思えなかったからだが――を見たとき、私の{驚愕|きょうがく}と恐怖とは非常なものだった。' },
  { t: 'しかしあれこれと考えてみてやっと気が安まった。猫が家につづいている庭につるしてあったことを私は思い出した。' },
  { t: '火事の警報が伝わると、この庭はすぐに大勢の人でいっぱいになり、――そのなかの誰かが猫を木から切りはなして、開いていた窓から私の部屋のなかへ投げこんだものにちがいない。' },
  { t: 'そこへ他の壁が落ちかかって、私の残虐の犠牲者を、その塗りたての{漆喰|しっくい}の壁のなかへ押しつけ、そうして、その漆喰の石灰と、火炎と、{死骸|しがい}から出たアンモニアとで、自分の見たような像ができあがったのだ。' },
  { t: '幾月ものあいだ私はその猫の{幻像|げんぞう}を払いのけることができなかった。' },
  { t: '私は猫のいなくなったことを悔むようにさえなり、そのころ行きつけの{悪所|あくしょ}でそれの代りになる同じ種類の、またいくらか似たような毛並のものがいないかと自分のまわりを捜すようにもなった。' },

  { chapter: ['五', '二匹目'], bg: 'tavern', amb: 'tavern',
    t: 'ある夜、ごくたちの悪い酒場に、なかば{茫然|ぼうぜん}として腰かけていると、' },
  { t: 'その部屋の主な家具をになっているジン酒かラム酒の{大樽|おおだる}の上に、なんだか黒い物がじっとしているのに、とつぜん注意をひかれた。', cat: ['barrelCat', 'on one'] },
  { t: '私は近づいて行って、それに手を触れてみた。それは一匹の黒猫――非常に大きな猫――で、プルートォくらいの大きさは十分あり、一つの点をのぞいて、あらゆる点で彼にとてもよく似ていた。' },
  { t: 'プルートォは体のどこにも白い毛が一本もなかったが、この猫は、胸のところがほとんど一面に、ぼんやりした形ではあるが、大きな、白い{斑点|はんてん}で{蔽|おお}われているのだ。', cat: ['barrelCat', 'on one patch'] },
  { t: '私がさわると、その猫はすぐに立ち上がり、さかんにごろごろ咽喉を鳴らし、私の手に体をすりつけ、私が目をつけてやったのを喜んでいるようだった。', sfx: 'purr' },
  { choice: '猫は、じっと私を見上げている。', options: [
      { label: '主人に買いたいと言う', steps: [

        { t: '私は{愛撫|あいぶ}をつづけていたが、家へ帰りかけようとすると、その動物はついて来たいような様子を見せた。' },
        { bg: 'night', amb: 'night', t: 'で、ついて来るままにさせ、歩いて行く途中でおりおりかがんで軽く手で{叩|たた}いてやった。', sfx: 'steps' } ] },
      { label: '黙って店を出る', steps: [

        { bg: 'night', amb: 'night', sfx: 'steps', t: '雨の夜道を歩きだすと、背後で小さな足音がした。振り返ると、あの黒猫が濡れた石畳の上を、音もなく私のあとをついて来ていた。', orig: true } ] }
  ] },
  { bg: 'home2', amb: 'home2', cat: ['cat', 'on one patch'],
    alt2: '家へ着くと、すぐに居ついてしまった。まるで、ずっと前からそこにいたかのように。', t: '家へ着くと、すぐに居ついてしまい、すぐ妻の非常なお気に入りになった。', sfx: 'meow' },
  { t: '私はというと、間もなくその猫に対する{嫌悪|けんお}の情が心のなかに湧き起るのに気がついた。これは自分の予想していたこととは正反対であった。' },
  { t: 'しかし――どうしてだか、またなぜだかは知らないが――猫がはっきり私を好いていることが私をかえって{厭|いや}がらせ、うるさがらせた。' },
  { t: 'だんだんに、この厭でうるさいという感情が{嵩|こう}じてはげしい憎しみになっていった。', heart: 64 },
  { bg: 'dawn', amb: 'dawn', heart: 0, cat: ['catD', 'patch'],
    t: '疑いもなく、その動物に対する私の憎しみを増したのは、それを家へ連れてきた翌朝、' },
  { t: 'それにもプルートォのように片眼がないということを発見したことであった。', cat: ['catD', 'on one patch'], sfx: 'stinger', fx: 'red' },

  /* ───────── 後編 ───────── */
  { chapter: ['六', '絞首台'], part2: true, bg: 'home2', amb: 'home2', cat: ['cat', 'on one patch'],
    t: 'しかし、私がこの猫を嫌えば嫌うほど、猫のほうはいよいよ私を好くようになってくるようだった。私のあとをつけまわり、そのしつこさは読者に理解してもらうのが困難なくらいであった。' },
  { t: '私が腰かけているときにはいつでも、{椅子|いす}の下にうずくまったり、あるいは{膝|ひざ}の上へ上がって、しきりにどこへでもいまいましくじゃれついたりした。', sfx: 'purr' },
  { t: 'そんなときには、殴り殺してしまいたかったけれども、そうすることを差し控えたのは、いくらか自分の以前の罪悪を思い出すためであったが、主としては――あっさり白状してしまえば――その動物がほんとうに怖かったためであった。' },
  { bg: 'cell', amb: 'cell',

  { bg: 'patch', amb: 'patch', st: ['patch', ''],
    t: 'その猫と前に殺した猫との{唯一|ゆいいつ}の眼に見える違いといえば、さっき話したあの白い毛の斑点なのだが、妻はその斑点のことで何度か私に注意していた。' },
  { t: 'この斑点は、大きくはあったが、もとはたいへんぼんやりした形であったということを、読者は記憶せられるであろう。' },
  { t: 'ところが、だんだんに――ほとんど眼につかないほどにゆっくりと、そして、長いあいだ私の理性はそれを気の迷いだとして否定しようとあせっていたのだが――それが、とうとう、まったくきっぱりした輪郭となった。', st: ['patch', 'gallows'], heart: 60 },
  { t: 'それはいまや、恐ろしい――もの{凄|すご}い物の――絞首台の――形になったのだ！', sfx: 'stinger', heart: 84 },
  { t: '――おお、恐怖と罪悪との――{苦悶|くもん}と死との痛ましい恐ろしい刑具の形になったのだ！', heart: 0 },
  { bg: 'bed', amb: 'bed', st: ['bed', 'empty'],
    t: 'ああ！　昼も夜も私はもう安息の恩恵というものを知らなくなった！　昼間はかの動物がちょっとも私を一人にしておかなかった。' },
  { t: '夜には、私は言いようもなく恐ろしい夢から毎時間ぎょっとして目覚めると、', sfx: 'gasp', heart: 104 },
  { t: 'そいつの熱い息が自分の顔にかかり、そのどっしりした重さが――私には払い落す力のない悪魔の化身が――いつもいつも私の心臓の上に{圧|お}しかかっているのだった！', st: ['bed', ''], sfx: 'breath' },
  { t: 'こういった{呵責|かしゃく}に押しつけられて、私のうちに少しばかり残っていた善も敗北してしまった。邪悪な考えが私の唯一の友となった、――もっとも暗黒な、もっとも邪悪な考えが。', heart: 0 },
  { glitch: ['妻', '猫'], t: 'なんの苦情も言わない私の妻は、ああ！　それを誰よりもいつもひどく受けながら、辛抱づよく我慢したのだった。' },

  { chapter: ['七', '穴蔵'], bg: 'cellar', amb: 'cellar', st: ['cellar', ''],
    t: 'ある日、妻はなにかの家の用事で、貧乏のために私たちが仕方なく住んでいた古い穴蔵のなかへ、私と一緒に降りてきた。', sfx: 'stairs' },
  { t: '猫もその急な階段を私のあとへついて降りてきたが、もう少しのことで私を真っ逆さまに突き落そうとしたので、私はかっと激怒した。', sfx: 'hiss', fx: 'shake' },
  { t: '怒りのあまり、これまで自分の手を止めていたあの子供らしい怖さも忘れて、{斧|おの}を振り上げ、その動物をめがけて一撃に打ち下ろそうとした。', st: ['cellar', 'axe'], heart: 118, sfx: 'raise' },
  { t: 'が、その一撃は妻の手でさえぎられた。', sfx: 'grab' },
  { choice: '妻の手が、私の腕をつかんでいる。', options: [
      { label: '腕をひき放す', steps: [] },
      { label: '斧を下ろす', goto: 'spared' }
  ] },
  { t: 'この邪魔立てに悪鬼以上の憤怒に駆られて、私は妻につかまれている腕をひき放し、', heart: 150, sfx: 'wrench' },
  { bg: 'black', amb: 'none', heart: 0, sfx: 'axe', fx: 'red', t: '斧を彼女の脳天に打ちこんだ。' },
  { t: '彼女は{呻|うめ}き声もたてずに、その場で倒れて死んでしまった。', sfx: 'fall' },
  { bg: 'cellar', amb: 'cellar', st: ['cellar', ''],
    t: 'この恐ろしい殺人をやってしまうと、私はすぐに、きわめて慎重に、死体を隠す仕事に取りかかった。' },
  { t: '昼でも夜でも、近所の人々の目にとまる恐れなしには、それを家から運び去ることができないということは、私にはわかっていた。いろいろの計画が心に浮んだ。' },
  { t: '最後に、これらのどれよりもずっといいと思われる工夫を考えついた。中世紀の{僧侶|そうりょ}たちが彼らの犠牲者を壁に塗りこんだと伝えられているように――それを穴蔵の壁に塗りこむことに決めたのだ。' },
  { t: 'そこの壁はぞんざいにできていたし、近ごろ粗い{漆喰|しっくい}を一面に塗られたばかりで、空気が湿っているためにその漆喰が固まっていないのだった。', sfx: 'drip' },
  { t: 'その上に、一方の壁には、穴蔵の他のところと同じようにしてある、見せかけだけの煙突か暖炉のためにできた、突き出た一カ所があった。' },
  { hush: 900, t: '{鉄梃|かなてこ}を使って私はたやすく{煉瓦|れんが}を動かし、', st: ['cellar', 'hole'], sfx: 'bricks' },
  { t: '内側の壁に死体を注意深く寄せかけると、その位置に支えておきながら、大した苦もなく全体をもとのとおりに積み直した。', st: ['cellar', 'fresh'], sfx: 'bricks' },
  { t: 'できるかぎりの用心をして{膠泥|モルタル}と、砂と、毛髪とを手に入れると、前のと区別のつけられない漆喰をこしらえ、それで新しい煉瓦細工の上をとても念入りに塗った。', sfx: 'trowel' },
  { t: '壁には手を加えたような様子が少しも見えなかった。床の上の{屑|くず}はごく注意して拾い上げた。', st: ['cellar', ''] },
  { t: '私は得意になってあたりを見まわして、こう{独言|ひとりごと}を言った。――「さあ、これで少なくとも今度だけは{己|おれ}の骨折りも{無駄|むだ}じゃなかったぞ」' },
  { bg: 'dawn', amb: 'dawn', cat: ['catD', ''],
    scare: 's1', t: '次に私のやることは、かくまでの不幸の原因であったあの獣を捜すことであった。とうとう私はそれを殺してやろうと堅く決心していたからである。' },
  { t: 'が、そのずるい動物は私のさっきの怒りのはげしさにびっくりしたらしく、私がいまの気分でいるところへは姿を見せるのを控えているようであった。' },
  { bg: 'bed', amb: 'bed', st: ['bed', 'empty'],
    t: '猫はその夜じゅう姿をあらわさなかった。――で、そのために、あの猫を家へ連れてきて以来、少なくとも一晩だけは、私はぐっすりと安らかに眠った。' },
  { t: 'そうだ、魂に人殺しの重荷を負いながらも眠ったのだ！' },
  { bg: 'dawn', amb: 'dawn', cat: ['catD', ''],
    t: '二日目も過ぎ三日目も過ぎたが、それでもまだ私の{呵責者|かしゃくしゃ}は出てこなかった。もう一度私は自由な人間として呼吸した。' },
  { lurk: true, t: 'あの怪物は永久にこの屋内から逃げ去ってしまったのだ！　私はもうあいつを見ることはないのだ！　私の幸福はこの上もなかった！' },
  { t: '二、三の{訊問|じんもん}は受けたが、それには造作なく答えた。家宅捜索さえ一度行われた、――が無論なにも発見されるはずがなかった。私は自分の未来の幸運を確実だと思った。' },

  { chapter: ['八', '壁の中の声'], bg: 'dawn', amb: 'dawn',
